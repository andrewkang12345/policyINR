name: droid_lowdim_full_all_min300
kind: droid
source: droid
data_dir: ${oc.env:INR_DROID_CACHE,${oc.env:HOME}/.cache/INR/droid}
# Full DROID release scan, keeping the same fixed collector policies as the
# 80-shard DROID runs and filtering to episodes with at least 300 pairs.
max_shards: null
max_episodes: 1000000
n_collectors: 3
collectors:
  - RAIL
  - IRIS
  - CLVR
min_episodes_per_collector: 8
min_length: 300
max_length: null
ood_task_family: marker
