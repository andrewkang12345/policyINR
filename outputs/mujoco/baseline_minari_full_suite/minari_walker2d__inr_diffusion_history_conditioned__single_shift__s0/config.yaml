seed: 0
run_name: minari_walker2d__inr_diffusion_history_conditioned__single_shift__s0
output_dir: outputs/full_suite/minari_walker2d__inr_diffusion_history_conditioned__single_shift__s0
train:
  epochs: 10
  batch_size: 256
  eval_batch_size: 512
  num_workers: 2
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  log_every: 50
  val_every_epoch: 1
  device: cuda
  amp: true
  history_k: 16
  early_stop_patience: 0
shift:
  kind: shared_region
  ood_fraction: 0.3
  min_per_partition: 3
data:
  name: minari_walker2d
  kind: minari
  env: walker2d
  max_episodes_per_policy: 40
  min_length: 32
  max_length: 256
model:
  name: inr_diffusion_history_conditioned
  kind: inr_diffusion_history_conditioned
  latent_dim: 64
  d_model: 128
  n_heads: 4
  n_layers: 3
  denoise_hidden: 256
  denoise_layers: 3
  n_diffusion_steps: 50
  beta_start: 0.0001
  beta_end: 0.02
  n_sample_steps: 10
  dropout: 0.0
  shuffle_history_train: false
experiment:
  name: single_shift
  description: 'Policy 1: train ID, test OOD. Policy 2: train ID, test ID.'
  policies:
  - pid: 0
    train: ID
    test: OOD
  - pid: 1
    train: ID
    test: ID
eval:
  name: default
  per_episode_samples: 8
  min_episode_length_for_eval: 4
  probe_max_iter: 1000
  probe_C: 1.0
  probe_cv_folds: 5
  gen_n_batches: null
