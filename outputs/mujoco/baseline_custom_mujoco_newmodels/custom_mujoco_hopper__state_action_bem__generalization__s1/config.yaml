seed: 1
run_name: custom_mujoco_hopper__state_action_bem__generalization__s1
output_dir: /ocean/projects/cis260099p/akang3/INR/outputs/mujoco/baseline_custom_mujoco_newmodels/custom_mujoco_hopper__state_action_bem__generalization__s1
train:
  epochs: 20
  batch_size: 256
  eval_batch_size: 512
  num_workers: 0
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  log_every: 50
  val_every_epoch: 1
  device: cuda
  amp: true
  history_k: 16
  early_stop_patience: 0
  materialize_dataset: false
shift:
  kind: shared_region
  ood_fraction: 0.3
  min_per_partition: 3
data:
  name: custom_mujoco_hopper
  kind: custom_mujoco
  env: hopper
  dataset_id: inr_mujoco/hopper/controlled-v0
  max_episodes_per_policy: 384
  min_length: 32
  max_length: 128
  generation:
    generate_if_missing: true
    force_rebuild: false
    device: cuda
    deterministic: true
    episode_horizon: 128
    min_episode_length: 32
    policies:
    - simple
    - medium
    - expert
    episodes_per_policy:
      ID: 256
      OOD: 128
    calibration:
      episodes_per_policy: 4
      horizon: 256
      sample_stride: 4
    state_distribution:
      kind: clustered_reference
      n_components: 16
      qpos_noise_scale: 0.15
      qvel_noise_scale: 0.25
      std_floor: 0.05
      clip_margin_scale: 0.25
model:
  name: state_action_bem
  kind: state_action_bem
  n_clusters: 64
  kmeans_max_iter: 50
  kmeans_max_samples: 50000
  seed: 0
  shuffle_history_train: true
experiment:
  name: generalization
  description: 'Policy 1: train OOD, test ID. Policy 2: train OOD, test ID.'
  policies:
  - pid: 0
    train: OOD
    test: ID
  - pid: 1
    train: OOD
    test: ID
eval:
  name: default
  per_episode_samples: 8
  min_episode_length_for_eval: 4
  probe_max_iter: 1000
  probe_C: 1.0
  probe_cv_folds: 5
  gen_n_batches: null
