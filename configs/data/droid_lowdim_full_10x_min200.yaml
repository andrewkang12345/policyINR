name: droid_lowdim_full_10x_min200
kind: droid
source: droid
data_dir: ${oc.env:INR_DROID_CACHE,${oc.env:HOME}/.cache/INR/droid}
# Same downloaded 80-shard DROID subset and fixed collector policies as
# droid_lowdim_full_10x, but only keep full episodes with at least 200 pairs.
max_shards: 80
max_episodes: 6000
n_collectors: 3
collectors:
  - RAIL
  - IRIS
  - CLVR
min_episodes_per_collector: 8
min_length: 200
max_length: null
ood_task_family: marker
