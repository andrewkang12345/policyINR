seed: 0
run_name: lichess_top5_full_2Xepisode__cvae__novel_generalization_5p__s0
output_dir: outputs/lichess/2x_hk240_top5/lichess_top5_full_2Xepisode__cvae__novel_generalization_5p__s0
train:
  epochs: 10
  batch_size: 128
  eval_batch_size: 512
  num_workers: 4
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  log_every: 50
  val_every_epoch: 1
  device: cuda
  amp: true
  history_k: 240
  early_stop_patience: 0
  materialize_dataset: false
shift:
  kind: shared_region
  ood_fraction: 0.3
  min_per_partition: 3
data:
  name: lichess_top5_full_2Xepisode
  kind: lichess
  pgn_dir: ${oc.env:INR_LICHESS_CACHE,${oc.env:HOME}/.cache/INR/lichess}/pgn
  players:
  - lance5500
  - Zhigalko_Sergei
  - penguingim1
  - nihalsarin2004
  - Night-King96
  max_games_per_player: 5000
  min_plies: 20
  max_plies: 120
  tracked_player_only: true
  games_per_episode: 2
model:
  name: cvae
  kind: cvae
  latent_dim: 64
  d_model: 128
  n_heads: 4
  n_layers: 2
  decoder_hidden: 256
  kl_weight: 0.01
  dropout: 0.0
  shuffle_history_train: true
experiment:
  name: novel_generalization_5p
  description: 'Policy 1: OOD/ID. Policy 2: OOD/ID. Policy 3: unseen in training,
    test on ID. (5p)'
  policies:
  - pid: 0
    train: OOD
    test: ID
  - pid: 1
    train: OOD
    test: ID
  - pid: 2
    train: OOD
    test: ID
  - pid: 3
    train: OOD
    test: ID
  - pid: 4
    train: NONE
    test: ID
eval:
  name: default
  per_episode_samples: 8
  min_episode_length_for_eval: 4
  probe_max_iter: 1000
  probe_C: 1.0
  probe_cv_folds: 5
  gen_n_batches: null
