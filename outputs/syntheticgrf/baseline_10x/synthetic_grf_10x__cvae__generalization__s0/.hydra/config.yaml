seed: 0
run_name: synthetic_grf_10x__cvae__generalization__s0
output_dir: outputs/full_suite_new_datasets/synthetic_grf_10x__cvae__generalization__s0
train:
  epochs: 10
  batch_size: 32
  eval_batch_size: 512
  num_workers: 2
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  log_every: 50
  val_every_epoch: 1
  device: cuda
  amp: true
  history_k: 160
  early_stop_patience: 0
shift:
  kind: shared_region
  ood_fraction: 0.3
  min_per_partition: 3
data:
  name: synthetic_grf_10x
  kind: synthetic
  n_policies: 3
  episodes_per_policy: 80
  episode_length: 1280
  state_dim: 8
  action_dim: 4
  state_generator: grf
  action_policy: grf_policy
  noise_std: 0.05
  state_gen_kwargs:
    n_modes: 8
    length_scale: 1.0
  action_gen_kwargs:
    n_modes: 8
    length_scale: 1.0
model:
  name: cvae
  kind: cvae
  latent_dim: 64
  d_model: 128
  n_heads: 4
  n_layers: 2
  decoder_hidden: 256
  kl_weight: 0.01
  dropout: 0.0
  shuffle_history_train: true
experiment:
  name: generalization
  description: 'Policy 1: train OOD, test ID. Policy 2: train OOD, test ID.'
  policies:
  - pid: 0
    train: OOD
    test: ID
  - pid: 1
    train: OOD
    test: ID
eval:
  name: default
  per_episode_samples: 8
  min_episode_length_for_eval: 4
  probe_max_iter: 1000
  probe_C: 1.0
  probe_cv_folds: 5
  gen_n_batches: null
