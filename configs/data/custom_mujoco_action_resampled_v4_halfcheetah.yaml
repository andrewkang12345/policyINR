name: custom_mujoco_action_resampled_v4_halfcheetah
kind: custom_mujoco
env: halfcheetah
dataset_id: inr_mujoco_action_resampled_v4/halfcheetah/controlled-v0
max_episodes_per_policy: 384
min_length: 32
max_length: 128
generation:
  generate_if_missing: true
  force_rebuild: false
  generation_mode: action_resampled_v4
  device: cuda
  deterministic: true
  episode_horizon: 128
  min_episode_length: 32
  policies: [simple, medium, expert]
  episodes_per_policy:
    ID: 256
    OOD: 128
  calibration:
    episodes_per_policy: 4
    horizon: 256
    sample_stride: 4
  action_distribution:
    kind: minari_id_action_matched_ood_v4
    tail_fraction: 0.4
    train_frac: 0.7
    val_frac: 0.15
    acceptance_threshold: 2.5
    candidate_batch_size: 2048
    max_candidate_batches: 128
    probe_like_samples: 8
    probe_like_repeats: 4
