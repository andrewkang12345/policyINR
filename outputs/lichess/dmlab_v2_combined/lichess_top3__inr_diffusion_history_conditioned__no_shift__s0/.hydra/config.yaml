seed: 0
run_name: lichess_top3__inr_diffusion__no_shift__s0
output_dir: outputs/lichess_dmlab_v2/lichess_top3__inr_diffusion__no_shift__s0
train:
  epochs: 10
  batch_size: 128
  eval_batch_size: 512
  num_workers: 2
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  log_every: 50
  val_every_epoch: 1
  device: cuda
  amp: true
  history_k: 16
  early_stop_patience: 0
shift:
  kind: shared_region
  ood_fraction: 0.3
  min_per_partition: 3
data:
  name: lichess_top3
  kind: lichess
  pgn_dir: ${oc.env:HOME}/.cache/INR/lichess/pgn
  players:
  - lance5500
  - Zhigalko_Sergei
  - penguingim1
  max_games_per_player: 5000
  min_plies: 20
  max_plies: 120
  tracked_player_only: true
model:
  name: inr_diffusion
  kind: inr_diffusion
  latent_dim: 64
  d_model: 128
  n_heads: 4
  n_layers: 3
  denoise_hidden: 256
  denoise_layers: 3
  n_diffusion_steps: 50
  beta_start: 0.0001
  beta_end: 0.02
  n_sample_steps: 10
  dropout: 0.0
  shuffle_history_train: false
experiment:
  name: no_shift
  description: 'Policy 1: train ID, test ID. Policy 2: train ID, test ID.'
  policies:
  - pid: 0
    train: ID
    test: ID
  - pid: 1
    train: ID
    test: ID
eval:
  name: default
  per_episode_samples: 8
  min_episode_length_for_eval: 4
  probe_max_iter: 1000
  probe_C: 1.0
  probe_cv_folds: 5
  gen_n_batches: null
