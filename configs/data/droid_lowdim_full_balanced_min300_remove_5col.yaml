name: droid_lowdim_full_balanced_min300_remove_5col
kind: droid
source: droid
data_dir: ${oc.env:INR_DROID_CACHE,${oc.env:HOME}/.cache/INR/droid}
# 5-collector extension of the balanced min300 droid cache, used for the
# all-policies probe. Adds TRI and AUTOLab — the two highest-volume
# collectors not already in {RAIL, IRIS, CLVR} per a 30-shard sniff of
# the cached r2d2_faceblur shards.
max_shards: null
max_episodes: 1000000
n_collectors: 5
collectors:
  - RAIL
  - IRIS
  - CLVR
  - TRI
  - AUTOLab
min_episodes_per_collector: 8
min_length: 300
max_length: null
ood_task_family: remove
