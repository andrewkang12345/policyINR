name: custom_mujoco_state_resampled_v2_humanoid
kind: custom_mujoco
env: humanoid
dataset_id: inr_mujoco_state_resampled_v2/humanoid/controlled-v0
max_episodes_per_policy: 384
min_length: 32
max_length: 128
generation:
  generate_if_missing: true
  force_rebuild: false
  generation_mode: state_resampled_v2
  device: cuda
  deterministic: true
  episode_horizon: 128
  min_episode_length: 32
  policies: [simple, medium, expert]
  episodes_per_policy:
    ID: 256
    OOD: 128
  calibration:
    episodes_per_policy: 4
    horizon: 256
    sample_stride: 4
  state_distribution:
    kind: shared_state_density_v2
    knn_k: 32
    tail_fraction: 0.4
