seed: 0
run_name: dmlab_seekavoid__inr_transformer_fitted_latent__single_shift__s0
output_dir: outputs/lichess_dmlab_v2/dmlab_seekavoid__inr_transformer_fitted_latent__single_shift__s0
train:
  epochs: 10
  batch_size: 128
  eval_batch_size: 512
  num_workers: 2
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  log_every: 50
  val_every_epoch: 1
  device: cuda
  amp: true
  history_k: 16
  early_stop_patience: 0
shift:
  kind: predefined_split
  ood_fraction: 0.3
  min_per_partition: 3
data:
  name: dmlab_seekavoid
  kind: dmlab
  max_episodes_per_policy: 60
  cnn_feature_dim: 128
  featurizer_seed: 0
model:
  name: inr_transformer_fitted_latent
  kind: inr_transformer_fitted_latent
  latent_dim: 64
  d_model: 128
  n_heads: 4
  n_layers: 3
  head_hidden: 256
  head_blocks: 3
  dropout: 0.0
  shuffle_history_train: false
  use_unit_latents: true
  behavior_unit: episode
  unit_window_size: 16
  unit_latent_l2_weight: 0.0001
  latent_infer_steps: 40
  latent_infer_lr: 0.05
  latent_infer_l2_weight: 0.0001
experiment:
  name: single_shift
  description: 'Policy 1: train ID, test OOD. Policy 2: train ID, test ID.'
  policies:
  - pid: 0
    train: ID
    test: OOD
  - pid: 1
    train: ID
    test: ID
eval:
  name: default
  per_episode_samples: 8
  min_episode_length_for_eval: 4
  probe_max_iter: 1000
  probe_C: 1.0
  probe_cv_folds: 5
  gen_n_batches: null
