seed: 1
run_name: dmlab_seekavoid_full__inr_diffusion_history_conditioned_shuffle__novel_generalization__s1
output_dir: /ocean/projects/cis260099p/akang3/INR/outputs/dmlabseekavoid/dmlab_v2_combined_newmodels/dmlab_seekavoid_full__inr_diffusion_history_conditioned_shuffle__novel_generalization__s1
train:
  epochs: 15
  batch_size: 128
  eval_batch_size: 512
  num_workers: 0
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  log_every: 50
  val_every_epoch: 1
  device: cuda
  amp: true
  history_k: 16
  early_stop_patience: 0
  materialize_dataset: false
shift:
  kind: shared_region
  ood_fraction: 0.3
  min_per_partition: 3
data:
  name: dmlab_seekavoid_full
  kind: dmlab
  max_episodes_per_policy: 60
  cnn_feature_dim: 128
  featurizer_seed: 0
model:
  name: inr_diffusion_history_conditioned_shuffle
  kind: inr_diffusion_history_conditioned
  latent_dim: 64
  d_model: 128
  n_heads: 4
  n_layers: 3
  denoise_hidden: 256
  denoise_layers: 3
  n_diffusion_steps: 50
  beta_start: 0.0001
  beta_end: 0.02
  n_sample_steps: 10
  dropout: 0.0
  shuffle_history_train: true
  use_unit_latents: false
  behavior_unit: episode
  unit_window_size: 16
experiment:
  name: novel_generalization
  description: 'Policy 1: OOD/ID. Policy 2: OOD/ID. Policy 3: unseen in training,
    test on ID.'
  policies:
  - pid: 0
    train: OOD
    test: ID
  - pid: 1
    train: OOD
    test: ID
  - pid: 2
    train: NONE
    test: ID
eval:
  name: default
  per_episode_samples: 8
  min_episode_length_for_eval: 4
  probe_max_iter: 1000
  probe_C: 1.0
  probe_cv_folds: 5
  gen_n_batches: null
