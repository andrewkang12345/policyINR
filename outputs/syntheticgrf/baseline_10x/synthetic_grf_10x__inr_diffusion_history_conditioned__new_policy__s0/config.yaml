seed: 0
run_name: synthetic_grf_10x__inr_diffusion_history_conditioned__new_policy__s0
output_dir: outputs/full_suite_new_datasets/synthetic_grf_10x__inr_diffusion_history_conditioned__new_policy__s0
train:
  epochs: 10
  batch_size: 32
  eval_batch_size: 512
  num_workers: 2
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  log_every: 50
  val_every_epoch: 1
  device: cuda
  amp: true
  history_k: 160
  early_stop_patience: 0
shift:
  kind: shared_region
  ood_fraction: 0.3
  min_per_partition: 3
data:
  name: synthetic_grf_10x
  kind: synthetic
  n_policies: 3
  episodes_per_policy: 80
  episode_length: 1280
  state_dim: 8
  action_dim: 4
  state_generator: grf
  action_policy: grf_policy
  noise_std: 0.05
  state_gen_kwargs:
    n_modes: 8
    length_scale: 1.0
  action_gen_kwargs:
    n_modes: 8
    length_scale: 1.0
model:
  name: inr_diffusion_history_conditioned
  kind: inr_diffusion_history_conditioned
  latent_dim: 64
  d_model: 128
  n_heads: 4
  n_layers: 3
  denoise_hidden: 256
  denoise_layers: 3
  n_diffusion_steps: 50
  beta_start: 0.0001
  beta_end: 0.02
  n_sample_steps: 10
  dropout: 0.0
  shuffle_history_train: false
  use_unit_latents: false
  behavior_unit: episode
  unit_window_size: 16
experiment:
  name: new_policy
  description: 'Policy 1: ID/ID. Policy 2: ID/ID. Policy 3: unseen in training, test
    on ID.'
  policies:
  - pid: 0
    train: ID
    test: ID
  - pid: 1
    train: ID
    test: ID
  - pid: 2
    train: NONE
    test: ID
eval:
  name: default
  per_episode_samples: 8
  min_episode_length_for_eval: 4
  probe_max_iter: 1000
  probe_C: 1.0
  probe_cv_folds: 5
  gen_n_batches: null
